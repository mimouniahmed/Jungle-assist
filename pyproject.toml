[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-assistant"
version = "0.1.0"
description = "Plan de jeu League of Legends à partir d'une composition : Riot API, XGBoost + SHAP, Claude API"
readme = "README.md"
authors = [{ name = "Ahmed Mimouni", email = "amimouni.cs@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
    "pandas",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/mimouniahmed/Jungle-assist"

[project.scripts]
lol-assistant = "lol_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["lol_assistant*"]
